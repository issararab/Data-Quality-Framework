<svg width="1640" height="410" viewBox="0 0 1640 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LakeScore high-level architecture">
  <defs>
    <linearGradient id="ao-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#123A5E"/>
    </linearGradient>
    <linearGradient id="ao-icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E7FD1"/>
      <stop offset="100%" stop-color="#16C7B0"/>
    </linearGradient>
    <marker id="ao-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5FA8CE"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1640" height="410" rx="32" fill="url(#ao-bg)"/>

  <!-- ============ YOUR LAKEHOUSE ============ -->
  <text x="150" y="55" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="700" letter-spacing="2" fill="#6FA8C9">YOUR LAKEHOUSE</text>

  <g>
    <ellipse cx="150" cy="165" rx="58" ry="18" fill="url(#ao-icon)"/>
    <rect x="92" y="165" width="116" height="70" fill="url(#ao-icon)"/>
    <ellipse cx="150" cy="235" rx="58" ry="18" fill="url(#ao-icon)"/>
    <ellipse cx="150" cy="200" rx="58" ry="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"/>
  </g>
  <text x="150" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#FFFFFF">Unity Catalog</text>
  <text x="150" y="313" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#FFFFFF">Tables</text>

  <line x1="216" y1="200" x2="288" y2="200" stroke="#5FA8CE" stroke-width="3" marker-end="url(#ao-arrow)"/>

  <!-- ============ LAKESCORE PIPELINE ============ -->
  <text x="740" y="55" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="700" letter-spacing="2" fill="#6FA8C9">LAKESCORE PIPELINE</text>

  <!-- step 1 -->
  <circle cx="390" cy="200" r="46" fill="url(#ao-icon)"/>
  <text x="390" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">1</text>
  <text x="390" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#FFFFFF">Configure</text>

  <line x1="446" y1="200" x2="574" y2="200" stroke="#5FA8CE" stroke-width="3" marker-end="url(#ao-arrow)"/>

  <!-- step 2 -->
  <circle cx="630" cy="200" r="46" fill="url(#ao-icon)"/>
  <text x="630" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">2</text>
  <text x="630" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#FFFFFF">Enrich</text>
  <text x="630" y="311" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9FB4C7">GenAI descriptions</text>

  <line x1="686" y1="200" x2="814" y2="200" stroke="#5FA8CE" stroke-width="3" marker-end="url(#ao-arrow)"/>

  <!-- step 3 -->
  <circle cx="870" cy="200" r="46" fill="url(#ao-icon)"/>
  <text x="870" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">3</text>
  <text x="870" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#FFFFFF">Generate Checks</text>
  <text x="870" y="311" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9FB4C7">RAG + SodaCL</text>

  <line x1="926" y1="200" x2="1054" y2="200" stroke="#5FA8CE" stroke-width="3" marker-end="url(#ao-arrow)"/>

  <!-- step 4 -->
  <circle cx="1110" cy="200" r="46" fill="url(#ao-icon)"/>
  <text x="1110" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">4</text>
  <text x="1110" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#FFFFFF">Score</text>
  <text x="1110" y="311" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9FB4C7">run checks + dimensions</text>

  <line x1="1166" y1="200" x2="1244" y2="200" stroke="#5FA8CE" stroke-width="3" marker-end="url(#ao-arrow)"/>

  <!-- ============ RESULTS ============ -->
  <text x="1440" y="55" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="700" letter-spacing="2" fill="#6FA8C9">RESULTS</text>

  <g>
    <ellipse cx="1320" cy="182" rx="48" ry="14" fill="url(#ao-icon)"/>
    <rect x="1272" y="182" width="96" height="44" fill="url(#ao-icon)"/>
    <ellipse cx="1320" cy="226" rx="48" ry="14" fill="url(#ao-icon)"/>
  </g>
  <text x="1320" y="264" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">dq_summary</text>

  <line x1="1374" y1="200" x2="1416" y2="200" stroke="#5FA8CE" stroke-width="3" marker-end="url(#ao-arrow)"/>

  <rect x="1420" y="155" width="150" height="90" rx="18" fill="url(#ao-icon)"/>
  <rect x="1444" y="205" width="16" height="24" rx="4" fill="#FFFFFF"/>
  <rect x="1470" y="190" width="16" height="39" rx="4" fill="#FFFFFF"/>
  <rect x="1496" y="175" width="16" height="54" rx="4" fill="#FFFFFF"/>
  <text x="1495" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">LakeScore</text>
  <text x="1495" y="296" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">Dashboard</text>

  <!-- caption -->
  <text x="820" y="382" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#7C93A8">
    Four Databricks notebooks, backed by the installable lakescore package — order enforced by the job DAG, not filenames.
  </text>
</svg>
